# Helm values layered onto the existing Argo CD chart install to turn on public
# SSO access (issue 121, ADR-011). Passed with -f alongside the install in
# deploy-aks-platform.yml; it adds to, and does not replace, the values already
# set there.
#
# Three things happen here, all governance-driven:
#
# 1. Entra OIDC via Azure Workload Identity, NOT a client secret. Argo CD 3.1+
#    redeems the OIDC authorization code SERVER-SIDE, so a browser-only PKCE
#    (SPA) flow does not work with Entra (it rejects server-side redemption of an
#    SPA-typed redirect with AADSTS9002327). Server-side redemption on Entra
#    needs the client to authenticate, which normally means a client secret --
#    but AGENTS.md permits exactly one non-OIDC credential (the Cloudflare
#    token). Workload identity is the way out: argocd-server authenticates the
#    token exchange with a FEDERATED managed identity (no static secret). The
#    server:{} block below labels the argocd-server pod and annotates its
#    ServiceAccount so the AKS workload-identity webhook injects the federated
#    token; the Entra app carries a federated identity credential trusting that
#    ServiceAccount (Terraform-managed in s1-aks-platform). The Entra app's
#    redirect URI must be under the WEB platform, not SPA -- see the runbook.
#
# 2. Read-only by default, admin by GROUP membership. policy.default:
#    role:readonly means every SSO user who logs in gets Argo CD's built-in
#    read-only role. Admin is granted by membership of one Entra group, matched
#    on the token's `groups` claim (the group's object id), not by individual
#    email. Add someone to that group to make them admin; remove them to revoke.
#    Invited B2B guests need no group at all; the read-only default covers them.
#    The oidc.config below requests the `groups` claim as essential so RBAC can
#    see it.
#
# 3. The local admin account is disabled and TLS terminates at the gateway.
#    admin.enabled: "false" removes the password login; access is SSO-only.
#    server.insecure: true stops Argo CD from doing its own TLS, because the
#    Istio gateway already terminated it (gateway.yaml).
#
# Rendered from an envsubst template by deploy-aks-platform.yml. Placeholders:
# ${ARGOCD_HOSTNAME}, ${AZURE_TENANT_ID}, ${ARGOCD_OIDC_CLIENT_ID},
# ${ARGOCD_ADMIN_GROUP}. No secret appears here.
configs:
  cm:
    url: https://${ARGOCD_HOSTNAME}
    admin.enabled: "false"
    oidc.config: |
      name: Microsoft Entra
      issuer: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
      clientID: ${ARGOCD_OIDC_CLIENT_ID}
      azure:
        useWorkloadIdentity: true
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        groups:
          essential: true
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, ${ARGOCD_ADMIN_GROUP}, role:admin
    scopes: "[groups]"
  params:
    server.insecure: true

# Azure Workload Identity for the argocd-server pod: the SA annotation names the
# Entra app (client id) and tenant, and the pod label opts the pod into the AKS
# workload-identity webhook, which projects a federated token argocd-server uses
# as its OIDC client assertion (no static secret). The matching federated
# identity credential on the Entra app is Terraform-managed in s1-aks-platform.
server:
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "${ARGOCD_OIDC_CLIENT_ID}"
      azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
  podLabels:
    azure.workload.identity/use: "true"
