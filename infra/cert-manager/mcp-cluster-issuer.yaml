# Dedicated ACME issuer for the private MCP hostname (issue 149). It reuses the
# cert-manager namespace's existing Cloudflare API token secret, but keeps its
# own ACME account key separate from the Argo CD issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-mcp
spec:
  acme:
    email: ${ACME_EMAIL}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-mcp-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
