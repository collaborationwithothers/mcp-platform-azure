# Deploy-and-bootstrap workflow for the epic 108 child (b) AKS platform
# (issue 110 task 8). Manual only, workflow_dispatch, never triggered by
# pull_request or push. runs-on: ubuntu-latest, OIDC-only auth (no client
# secret, no stored Azure credential) -- same auth pattern as
# ephemeral-env.yml.
#
# Design note this repo's CONTEXT.md defines "Live-test environment" as "The
# single gated environment in which terraform apply and destroy may run" --
# singular. This workflow reuses THAT SAME GitHub Environment (live-test)
# and its existing OIDC federated credential (subject
# repo:<org>/<repo>:environment:live-test) rather than introducing a second
# gated environment, even though its lifecycle differs from
# ephemeral-env.yml's apply-call-destroy pattern: this platform is created or
# resumed, never destroyed by this workflow. Reusing the existing trust
# avoids asking Hari to provision a second federated credential for a
# workflow with the same hard-safety posture (OIDC-only, no secret,
# environment-gated); the resource group this workflow manages
# (AKS_PLATFORM_RESOURCE_GROUP) is a stable, non-ephemeral group, distinct
# from ephemeral-env.yml's per-run rg-mcp-tracer-<run id> groups, so the two
# workflows never collide on state or on the cleanup sweep's expiry tag.
#
# Four actions, chosen at dispatch time:
# - plan: read the persistent state and fail if Terraform proposes any delete
#   or replacement action. The plan file remains on the ephemeral runner and is
#   never uploaded because Terraform plans can contain sensitive values.
# - bootstrap: terraform apply (create-or-update the persistent platform),
#   pin the Istio ingress gateway's load balancer, install Argo CD, apply
#   the app-of-apps.
# - idle-stop: az aks stop. Idles the cluster; disk/storage billing may
#   continue (COMPATIBILITY.md, "AKS stop/start billing" -- Learn's own
#   pages disagree on what still bills, so no blanket claim is made here).
# - idle-start: az aks start. Learn documents a 15-30 minute settle window
#   after stop before start succeeds; this workflow does not wait for you,
#   because that wait is exactly what makes stop-then-immediately-start a
#   guard, not a retry loop (issue 110 section 5, edge cases).
#
# The image build/push pipeline (issue 110 task 9) is a separate workflow,
# build-aks-placeholder-image.yml: pushing a placeholder image is not an
# infrastructure apply and does not need this workflow's cluster-lifecycle
# gate.
#
# Actor guard (issue 120; actor allow-list widened 2026-08-18 to admit
# haripraghash-bot so autonomous goal/loop sessions can run this). The
# refs/heads/main dispatch guard that #140 added was REMOVED 2026-08-18 at
# Hari's instruction: this workflow can now be dispatched from ANY branch, and
# a branch dispatch runs that branch's own workflow file. The consequences are
# deliberate and worth stating plainly: the actor allow-list below is now the
# sole in-file control over who may trigger, the live-test Environment's own
# branch policy (which currently allows non-main branches) is the only
# remaining ref control, and a real terraform apply can therefore run from
# unreviewed branch code. workflow_dispatch already requires write access to
# THIS repo and cannot be reached from a fork -- a GitHub platform guarantee,
# not something this file controls. The actor guard is an allow-list of
# exactly two: haripraghash and haripraghash-bot. The bot is allowed on
# purpose -- a goal or loop session dispatches this gated workflow
# autonomously, and AGENTS.md's hard rule forbids apply/destroy only OUTSIDE
# the live-test gate, which this workflow is. Any other write-access actor
# fails the guard closed. By design the live-test Environment requires no
# reviewer approval, so a loop session runs unattended; the actor allow-list
# above is the sole control over who may trigger. Because bootstrap stands up a
# persistent, billable cluster, its running cost is bounded out of band (an
# Azure subscription budget), not by a GitHub approval gate.

name: Deploy AKS platform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do."
        required: true
        type: choice
        options:
          - plan
          - bootstrap
          - idle-stop
          - idle-start
      confirm:
        description: "Type the action name exactly (e.g. \"bootstrap\") to confirm you understand this affects a real, persistent Azure cluster."
        required: true
        type: string

concurrency:
  group: live-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Require authorized actor
        shell: bash
        run: |
          if [ "${{ github.actor }}" != "haripraghash" ] && [ "${{ github.actor }}" != "haripraghash-bot" ]; then
            echo "::error::This workflow may only be triggered by haripraghash or haripraghash-bot. Triggering actor was '${{ github.actor }}'."
            exit 1
          fi

      - name: Require the action typed back exactly
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.action }}" ]; then
            echo "::error::confirm must exactly match action ('${{ inputs.action }}'). This workflow affects a real, persistent Azure cluster; the input exists so nobody triggers it by accident."
            exit 1
          fi

  plan:
    name: plan
    if: inputs.action == 'plan'
    needs: guard
    runs-on: ubuntu-latest
    environment: live-test
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      AKS_PLATFORM_STATE_KEY: s1-aks-platform.tfstate
      TF_VAR_resource_group_name: ${{ vars.AKS_PLATFORM_RESOURCE_GROUP }}
      TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
      TF_VAR_cluster_name: ${{ vars.AKS_PLATFORM_CLUSTER_NAME }}
      TF_VAR_registry_name: ${{ vars.AKS_PLATFORM_REGISTRY_NAME }}
      TF_VAR_runner_vnet_id: ${{ vars.AKS_PLATFORM_RUNNER_VNET_ID }}
      TF_VAR_ingress_gateway_private_ip: ${{ vars.AKS_PLATFORM_INGRESS_PRIVATE_IP }}
      TF_VAR_shared_observability_core_remote_state: >-
        {"storage_account_name":"${{ vars.TF_STATE_STORAGE_ACCOUNT }}","container_name":"${{ vars.TF_STATE_CONTAINER }}","key":"shared-observability-core.tfstate"}
      TF_VAR_shared_observability_metrics_remote_state: >-
        {"storage_account_name":"${{ vars.TF_STATE_STORAGE_ACCOUNT }}","container_name":"${{ vars.TF_STATE_CONTAINER }}","key":"shared-observability-metrics.tfstate"}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_argocd_hostname: ${{ vars.ARGOCD_HOSTNAME }}
      TF_VAR_argocd_oidc_client_id: ${{ vars.ARGOCD_OIDC_CLIENT_ID }}
      TF_VAR_mcp_server_application_client_id: ${{ fromJSON(secrets.S1_TFVARS_JSON).entra_auth.server_app_client_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Look up the OIDC principal's object id
        id: principal
        shell: bash
        run: |
          object_id="$(az ad sp show --id "${{ vars.AZURE_CLIENT_ID }}" --query id -o tsv)"
          echo "object_id=${object_id}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Plan and reject destructive actions
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        env:
          TF_VAR_acr_push_principal_ids: ${{ format('["{0}"]', steps.principal.outputs.object_id) }}
        run: |
          set -euo pipefail
          trap 'rm -f issue-149.tfplan' EXIT
          terraform init -input=false \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${AKS_PLATFORM_STATE_KEY}"
          terraform plan -input=false -lock-timeout=5m -out=issue-149.tfplan

          destructive_addresses="$(terraform show -json issue-149.tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions | index("delete"))
            | .address
          ')"
          if [ -n "${destructive_addresses}" ]; then
            echo "::error::The S1 AKS plan contains delete or replacement actions."
            printf '%s\n' "${destructive_addresses}"
            exit 1
          fi

          change_count="$(terraform show -json issue-149.tfplan | jq '[.resource_changes[] | select(.change.actions != ["no-op"])] | length')"
          {
            echo "## S1 AKS read-only plan"
            echo ""
            echo "Changed resource count: ${change_count}"
            echo "Delete or replacement actions: 0"
            echo ""
            echo "Functions and APIM use separate Terraform states. Their absence from this plan is an ownership boundary, not a plan assertion about those resources."
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: bootstrap
    if: inputs.action == 'bootstrap'
    needs: guard
    runs-on: ubuntu-latest
    environment: live-test
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      AKS_PLATFORM_STATE_KEY: s1-aks-platform.tfstate
      SHARED_OBSERVABILITY_CORE_STATE_KEY: shared-observability-core.tfstate
      SHARED_OBSERVABILITY_METRICS_STATE_KEY: shared-observability-metrics.tfstate
      TF_VAR_resource_group_name: ${{ vars.AKS_PLATFORM_RESOURCE_GROUP }}
      TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
      TF_VAR_cluster_name: ${{ vars.AKS_PLATFORM_CLUSTER_NAME }}
      TF_VAR_registry_name: ${{ vars.AKS_PLATFORM_REGISTRY_NAME }}
      # Non-secret resource id (see private-network/README.md); a GitHub
      # Environment variable, never a literal in this repo.
      TF_VAR_runner_vnet_id: ${{ vars.AKS_PLATFORM_RUNNER_VNET_ID }}
      TF_VAR_ingress_gateway_private_ip: ${{ vars.AKS_PLATFORM_INGRESS_PRIVATE_IP }}
      TF_VAR_shared_observability_core_remote_state: >-
        {"storage_account_name":"${{ vars.TF_STATE_STORAGE_ACCOUNT }}","container_name":"${{ vars.TF_STATE_CONTAINER }}","key":"shared-observability-core.tfstate"}
      TF_VAR_shared_observability_metrics_remote_state: >-
        {"storage_account_name":"${{ vars.TF_STATE_STORAGE_ACCOUNT }}","container_name":"${{ vars.TF_STATE_CONTAINER }}","key":"shared-observability-metrics.tfstate"}
      # Argo CD public access (issue 121, ADR-011). The zone id and hostname are
      # non-secret Environment variables; the Cloudflare API token is the repo's
      # one permitted non-OIDC SECRET (AGENTS.md carve-out), so it comes from
      # secrets, not vars, and is masked in logs.
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_argocd_hostname: ${{ vars.ARGOCD_HOSTNAME }}
      # The Argo CD Entra app client id, also fed to Terraform so it can attach
      # the workload-identity federated credential to that app (ADR-011).
      TF_VAR_argocd_oidc_client_id: ${{ vars.ARGOCD_OIDC_CLIENT_ID }}
      # The existing S1 MCP server app is also the resource application after
      # the AKS migration. Select only its non-secret client id from the
      # governed S1 configuration; do not create a second app registration.
      TF_VAR_mcp_server_application_client_id: ${{ fromJSON(secrets.S1_TFVARS_JSON).entra_auth.server_app_client_id }}
      # Non-secret render inputs for the Argo CD public-access manifests
      # (infra/argocd/public-access/*, envsubst templates). Tenant id is not a
      # secret but is account-specific and never a literal in this repo, so it
      # too comes from the Environment.
      ARGOCD_HOSTNAME: ${{ vars.ARGOCD_HOSTNAME }}
      ACME_EMAIL: ${{ vars.ARGOCD_ACME_EMAIL }}
      ARGOCD_OIDC_CLIENT_ID: ${{ vars.ARGOCD_OIDC_CLIENT_ID }}
      ARGOCD_ADMIN_GROUP: ${{ vars.ARGOCD_ADMIN_GROUP }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same reasoning and placement as ephemeral-env.yml's identical step:
      # the cached OIDC assertion azure/login used is only valid ~5 minutes,
      # and the apply below routinely runs longer than that.
      - name: Look up the OIDC principal's object id (for AcrPush)
        id: principal
        shell: bash
        run: |
          object_id="$(az ad sp show --id "${{ vars.AZURE_CLIENT_ID }}" --query id -o tsv)"
          echo "object_id=${object_id}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Ensure the platform resource group exists
        shell: bash
        run: |
          az group create \
            --name "${{ vars.AKS_PLATFORM_RESOURCE_GROUP }}" \
            --location "${{ vars.LIVE_TEST_LOCATION }}" \
            --tags scenario=aks-platform persistent=true

      - name: terraform init and apply - s1-aks-platform
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        env:
          TF_VAR_acr_push_principal_ids: ${{ format('["{0}"]', steps.principal.outputs.object_id) }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${AKS_PLATFORM_STATE_KEY}"
          terraform apply -input=false -auto-approve

      - name: Report placeholder promotion input
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        run: |
          set -euo pipefail
          workload_identity_client_id="$(terraform output -raw placeholder_workload_client_id)"
          {
            echo "## Placeholder workload promotion input"
            echo ""
            echo "Workload identity client ID: \`${workload_identity_client_id}\`"
            echo ""
            echo "After Build AKS placeholder image reports its immutable image reference,"
            echo "run **Promote AKS placeholder image** in the companion manifests"
            echo "repository with both values. That workflow opens the GitOps manifest PR"
            echo "that Argo CD will reconcile."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report MCP runtime foundation inputs
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        run: |
          set -euo pipefail
          workload_identity_client_id="$(terraform output -raw mcp_workload_client_id)"
          server_application_client_id="$(terraform output -raw mcp_server_application_client_id)"
          namespace="$(terraform output -raw mcp_namespace)"
          service_account="$(terraform output -raw mcp_service_account_name)"
          private_hostname="$(terraform output -raw mcp_private_hostname)"
          resource_audience="$(terraform output -raw mcp_resource_audience)"
          istio_revision="$(terraform output -raw istio_revision)"
          {
            echo "## MCP runtime foundation inputs"
            echo ""
            echo "Workload identity client ID: \`${workload_identity_client_id}\`"
            echo "Server application client ID: \`${server_application_client_id}\`"
            echo "Namespace: \`${namespace}\`"
            echo "ServiceAccount: \`${service_account}\`"
            echo "Private hostname: \`${private_hostname}\`"
            echo "Resource audience: \`${resource_audience}\`"
            echo "Configured Istio revision: \`${istio_revision}\`"
            echo ""
            echo "These are non-secret inputs for the companion manifests."
            echo "The configured Istio revision still needs a live installed-revision check before promotion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: kubelogin and az aks get-credentials
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${TF_VAR_resource_group_name}" \
            --name "$(terraform output -raw cluster_name)" \
            --overwrite-existing
          az aks install-cli --only-show-errors || true
          kubelogin convert-kubeconfig -l azurecli

      # Pins the Istio ingress gateway's Kubernetes Service to the
      # predetermined private IP and dedicated subnet (issue 110 task 5;
      # mcp-aks-host/README.md, "The ingress gateway's load balancer IP is
      # not this module's job" -- this is that Kubernetes-object-level step).
      # AKS uses the stable Service name below. The revision suffix belongs
      # to the gateway Deployment, not its Service (COMPATIBILITY.md).
      - name: Pin the Istio ingress gateway's load balancer
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        run: |
          set -euo pipefail
          service_name="aks-istio-ingressgateway-internal"
          namespace="aks-istio-ingress"
          expected_ip="$(terraform output -raw ingress_gateway_private_ip)"
          expected_subnet="$(terraform output -raw istio_ingress_subnet_name)"
          expected_internal="true"
          timeout_seconds=900
          deadline=$((SECONDS + timeout_seconds))
          observed_service_uid=""
          ready_observations=0

          report_gateway_state() {
            kubectl --request-timeout=10s get service -n "${namespace}" "${service_name}" -o wide || true
            kubectl --request-timeout=10s get deployments -n "${namespace}" -l istio=aks-istio-ingressgateway-internal -o wide || true
            kubectl --request-timeout=10s get pods -n "${namespace}" -l istio=aks-istio-ingressgateway-internal -o wide || true
            kubectl --request-timeout=10s get events -n "${namespace}" --sort-by=.lastTimestamp | tail -n 40 || true
          }

          while true; do
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out after ${timeout_seconds}s waiting for Istio ingress Service ${namespace}/${service_name} to keep its load-balancer annotations and report ${expected_ip}."
              report_gateway_state
              exit 1
            fi

            service_state="$(kubectl --request-timeout=10s get service "${service_name}" -n "${namespace}" -o jsonpath='{.metadata.uid}{"|"}{.metadata.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-internal}{"|"}{.metadata.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-ipv4}{"|"}{.metadata.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-internal-subnet}{"|"}{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            service_uid=""
            configured_internal=""
            configured_ip=""
            configured_subnet=""
            actual_ip=""

            if [ -n "${service_state}" ]; then
              IFS="|" read -r service_uid configured_internal configured_ip configured_subnet actual_ip <<< "${service_state}"

              if [ "${service_uid}" != "${observed_service_uid}" ]; then
                if [ -n "${observed_service_uid}" ]; then
                  echo "Detected replacement of Istio ingress Service ${namespace}/${service_name}; reconciling the replacement."
                else
                  echo "Discovered Istio ingress Service ${namespace}/${service_name}; applying its load-balancer configuration."
                fi
                observed_service_uid="${service_uid}"
                ready_observations=0
              fi

              if [ "${configured_internal}" != "${expected_internal}" ] || [ "${configured_ip}" != "${expected_ip}" ] || [ "${configured_subnet}" != "${expected_subnet}" ]; then
                echo "Ensuring the Istio ingress Service uses ${expected_ip} in ${expected_subnet}."
                if ! kubectl --request-timeout=10s annotate service "${service_name}" -n "${namespace}" --overwrite \
                  service.beta.kubernetes.io/azure-load-balancer-internal="${expected_internal}" \
                  service.beta.kubernetes.io/azure-load-balancer-ipv4="${expected_ip}" \
                  service.beta.kubernetes.io/azure-load-balancer-internal-subnet="${expected_subnet}"; then
                  echo "::warning::Could not annotate Istio ingress Service ${namespace}/${service_name}; retrying while the 15-minute budget remains."
                fi
              fi

              if [ "${configured_internal}" = "${expected_internal}" ] && [ "${configured_ip}" = "${expected_ip}" ] && [ "${configured_subnet}" = "${expected_subnet}" ] && [ "${actual_ip}" = "${expected_ip}" ]; then
                ready_observations=$((ready_observations + 1))
                if (( ready_observations == 3 )); then
                  break
                fi
              else
                ready_observations=0
              fi
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::Timed out after ${timeout_seconds}s waiting for Istio ingress Service ${namespace}/${service_name} to keep its load-balancer annotations and report ${expected_ip}; current value: ${actual_ip:-<pending>}."
              report_gateway_state
              exit 1
            fi
            sleep 10
          done

          kubectl --request-timeout=10s get service "${service_name}" -n "${namespace}" -o wide

      # Pins the EXTERNAL Istio gateway's public load balancer to the Standard
      # static public IP Terraform pre-created (issue 121, ADR-011). Same
      # pattern as the internal pin above, but the public path uses
      # azure-pip-name (name a pre-created public IP) instead of
      # azure-load-balancer-ipv4 (an internal address). Pinning keeps the
      # address stable across az aks stop/start, so the Cloudflare A record
      # Terraform manages keeps pointing at the right place.
      - name: Pin the external Istio gateway's public load balancer
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        run: |
          set -euo pipefail
          service_name="aks-istio-ingressgateway-external"
          namespace="aks-istio-ingress"
          expected_ip="$(terraform output -raw argocd_public_ip_address)"
          pip_name="$(terraform output -raw argocd_public_ip_name)"
          node_rg="$(terraform output -raw node_resource_group_name)"
          timeout_seconds=900
          deadline=$((SECONDS + timeout_seconds))
          observed_service_uid=""
          ready_observations=0

          report_gateway_state() {
            kubectl --request-timeout=10s get service -n "${namespace}" "${service_name}" -o wide || true
            kubectl --request-timeout=10s get events -n "${namespace}" --sort-by=.lastTimestamp | tail -n 40 || true
          }

          while true; do
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out after ${timeout_seconds}s waiting for external Istio gateway Service ${namespace}/${service_name} to report public IP ${expected_ip}."
              report_gateway_state
              exit 1
            fi

            service_state="$(kubectl --request-timeout=10s get service "${service_name}" -n "${namespace}" -o jsonpath='{.metadata.uid}{"|"}{.metadata.annotations.service\.beta\.kubernetes\.io/azure-pip-name}{"|"}{.metadata.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-resource-group}{"|"}{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            service_uid=""
            configured_pip=""
            configured_rg=""
            actual_ip=""

            if [ -n "${service_state}" ]; then
              IFS="|" read -r service_uid configured_pip configured_rg actual_ip <<< "${service_state}"

              if [ "${service_uid}" != "${observed_service_uid}" ]; then
                if [ -n "${observed_service_uid}" ]; then
                  echo "Detected replacement of external gateway Service ${namespace}/${service_name}; reconciling the replacement."
                else
                  echo "Discovered external gateway Service ${namespace}/${service_name}; applying its public-IP pin."
                fi
                observed_service_uid="${service_uid}"
                ready_observations=0
              fi

              if [ "${configured_pip}" != "${pip_name}" ] || [ "${configured_rg}" != "${node_rg}" ]; then
                echo "Ensuring the external gateway Service uses public IP ${pip_name} (${expected_ip}) in ${node_rg}."
                if ! kubectl --request-timeout=10s annotate service "${service_name}" -n "${namespace}" --overwrite \
                  service.beta.kubernetes.io/azure-pip-name="${pip_name}" \
                  service.beta.kubernetes.io/azure-load-balancer-resource-group="${node_rg}"; then
                  echo "::warning::Could not annotate external gateway Service ${namespace}/${service_name}; retrying while the 15-minute budget remains."
                fi
              fi

              if [ "${configured_pip}" = "${pip_name}" ] && [ "${configured_rg}" = "${node_rg}" ] && [ "${actual_ip}" = "${expected_ip}" ]; then
                ready_observations=$((ready_observations + 1))
                if (( ready_observations == 3 )); then
                  break
                fi
              else
                ready_observations=0
              fi
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::Timed out after ${timeout_seconds}s waiting for external Istio gateway Service ${namespace}/${service_name} to report public IP ${expected_ip}; current value: ${actual_ip:-<pending>}."
              report_gateway_state
              exit 1
            fi
            sleep 10
          done

          kubectl --request-timeout=10s get service "${service_name}" -n "${namespace}" -o wide

      # cert-manager gets and renews the Let's Encrypt certificates for the
      # public Argo CD hostname and private MCP hostname. Both use DNS-01 via
      # Cloudflare because the cluster has no HTTP-01 ingress controller. The
      # issuers reuse one Cloudflare token secret but keep separate ACME account
      # keys. The token is created in cert-manager's namespace straight from the
      # live-test secret and is never rendered into a committed file. Public
      # recursive resolvers keep the DNS-01 self-check on Cloudflare's public
      # view instead of Azure Private DNS's split-horizon view of the MCP zone.
      - name: Install cert-manager (pinned chart) and ClusterIssuers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          helm upgrade --install cert-manager jetstack/cert-manager \
            --version v1.21.1 \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --set dns01RecursiveNameserversOnly=true \
            --set-string 'dns01RecursiveNameservers=1.1.1.1:53\,8.8.8.8:53' \
            --wait --timeout 5m
          kubectl create secret generic cloudflare-api-token \
            --namespace cert-manager \
            --from-literal=api-token="${CLOUDFLARE_API_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          envsubst '${ACME_EMAIL}' \
            < infra/argocd/public-access/cluster-issuer.yaml | kubectl apply -f -
          envsubst '${ACME_EMAIL}' \
            < infra/cert-manager/mcp-cluster-issuer.yaml | kubectl apply -f -

      # Two steps, not one apply (issue 110 task 7 and section 5): the argo-cd
      # chart's own extraObjects value CAN embed the root Application (see
      # ADR-010, "Argo CD bootstrap"), but this repo follows the two-step
      # design Hari's planning session recorded. redis-ha.enabled is left at
      # the chart's own default (false; verified at issue start, chart
      # 10.3.2) -- the ticket's stated reason for setting it explicitly (a
      # 2-node system pool cannot schedule Redis HA) no longer matches the
      # current chart, which ships HA off by default; see ADR-010 for that
      # correction. It is still passed explicitly here so the intent is not
      # implicit and does not silently regress if a future chart bump flips
      # the default.
      - name: Install Argo CD (pinned chart)
        shell: bash
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          # Public-access overlay (issue 121, ADR-011): Entra OIDC via PKCE (no
          # client secret), read-only-by-default RBAC, disabled local admin, and
          # server.insecure so TLS terminates only at the Istio gateway. Rendered
          # from the committed envsubst template; passed with -f so it layers
          # onto the chart's own values, not replaces them.
          argocd_values="$(mktemp)"
          envsubst '${ARGOCD_HOSTNAME} ${AZURE_TENANT_ID} ${ARGOCD_OIDC_CLIENT_ID} ${ARGOCD_ADMIN_GROUP}' \
            < infra/argocd/public-access/argocd-server-values.yaml > "${argocd_values}"
          helm upgrade --install argocd argo/argo-cd \
            --version 10.3.2 \
            --namespace argocd \
            --create-namespace \
            --set redis-ha.enabled=false \
            --set controller.metrics.enabled=true \
            --set repoServer.metrics.enabled=true \
            --set server.metrics.enabled=true \
            -f "${argocd_values}" \
            --wait --timeout 10m

      # The deployment identity reads the connection string from the shared
      # Application Insights component. The MCP pod receives it only through
      # this live-only Secret and uses workload identity for ingestion.
      - name: Create live-only MCP telemetry configuration
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/compositions/shared-observability-core init -input=false \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${SHARED_OBSERVABILITY_CORE_STATE_KEY}" > /dev/null
          application_insights_component_resource_id="$(terraform -chdir=infra/compositions/shared-observability-core output -raw application_insights_id)"
          echo "::add-mask::${application_insights_component_resource_id}"
          application_insights_connection_string="$(az rest --method get --url "https://management.azure.com${application_insights_component_resource_id}?api-version=2020-02-02" --query properties.ConnectionString --output tsv --only-show-errors)"
          if [[ -z "${application_insights_connection_string}" ]]; then
            echo "Application Insights returned no connection string." >&2
            exit 1
          fi
          echo "::add-mask::${application_insights_connection_string}"
          kubectl create namespace mcp-platform --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mcp-server-telemetry \
            --namespace mcp-platform \
            --from-literal=application-insights-connection-string="${application_insights_connection_string}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply the app-of-apps
        shell: bash
        run: kubectl apply -f infra/argocd/bootstrap-app-of-apps.yaml

      # The Certificate, Gateway, and VirtualService that put Argo CD on the
      # public hostname (issue 121, ADR-011). Applied after the Argo CD install
      # so the argocd-server Service the VirtualService routes to already
      # exists. The Certificate triggers the DNS-01 issuance; the next step
      # waits for it.
      - name: Apply the Argo CD public ingress
        shell: bash
        run: |
          set -euo pipefail
          for manifest in certificate gateway virtualservice; do
            envsubst '${ARGOCD_HOSTNAME}' \
              < "infra/argocd/public-access/${manifest}.yaml" | kubectl apply -f -
          done

      # Proves the public path end to end (issue 121, ADR-011). This is the live
      # gate that flips ADR-011 from Proposed to Accepted. The endpoint is a
      # public IP with a public DNS name, so this ubuntu-latest runner reaches
      # it directly -- no VNet runner needed, unlike the private MCP backend.
      - name: Verify the public Argo CD endpoint
        shell: bash
        run: |
          set -euo pipefail
          host="${ARGOCD_HOSTNAME}"

          echo "Waiting for cert-manager to issue the Let's Encrypt certificate..."
          if ! kubectl wait --for=condition=Ready certificate/argocd-tls \
            -n aks-istio-ingress --timeout=300s; then
            echo "::error::The argocd-tls certificate was not Ready within 5m. cert-manager DNS-01 diagnostics follow."
            kubectl describe certificate/argocd-tls -n aks-istio-ingress || true
            kubectl get challenges,orders -A || true
            exit 1
          fi

          echo "Checking https://${host}/healthz returns 200 over the public path..."
          deadline=$((SECONDS + 300))
          last_code=""
          while true; do
            last_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${host}/healthz" || true)"
            if [ "${last_code}" = "200" ]; then
              echo "healthz returned 200."
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::https://${host}/healthz did not return 200 within 5m (last: ${last_code:-none})."
              exit 1
            fi
            echo "healthz=${last_code:-none}; DNS/LB may still be settling, retrying..."
            sleep 15
          done

          # Informational, not a gate: show the serving certificate issuer and
          # the SSO redirect target so the run records both. The exact Entra
          # redirect URL varies, so the build does not assert on it.
          echo "Serving certificate issuer:"
          curl -sS -v --max-time 10 "https://${host}/healthz" 2>&1 | grep -iE 'issuer:|subject:' || true
          echo "Unauthenticated UI redirect target:"
          curl -sS -o /dev/null -w '%{redirect_url}\n' --max-time 10 "https://${host}/" || true

      - name: Report readiness
        shell: bash
        run: |
          kubectl get applications -n argocd
          kubectl get pods -n aks-istio-ingress
          echo "Platform bootstrap complete. Argo CD will reconcile the placeholder workload from the manifests repo asynchronously; check 'kubectl get applications -n argocd' for sync status."

  idle-stop:
    name: idle-stop
    if: inputs.action == 'idle-stop'
    needs: guard
    runs-on: ubuntu-latest
    environment: live-test
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az aks stop
        shell: bash
        run: |
          az aks stop \
            --resource-group "${{ vars.AKS_PLATFORM_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_PLATFORM_CLUSTER_NAME }}"
          echo "::notice::Stopped. Wait 15-30 minutes (Microsoft Learn, undocumented exact SLA) before running idle-start -- see docs/runbooks/aks-platform-bootstrap.md. Record the measured Istio add-on and pinned-IP behaviour across this cycle in COMPATIBILITY.md with this run's id."

  idle-start:
    name: idle-start
    if: inputs.action == 'idle-start'
    needs: guard
    runs-on: ubuntu-latest
    environment: live-test
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az aks start
        shell: bash
        run: |
          az aks start \
            --resource-group "${{ vars.AKS_PLATFORM_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_PLATFORM_CLUSTER_NAME }}"
          echo "::notice::Started. Confirm the Istio add-on and the ingress gateway's pinned IP both survived, and record the result in COMPATIBILITY.md with this run's id (issue 110 acceptance criteria)."
