# Gated live-test workflow for the v1 tracer bullet (issue 9 / ticket 5,
# docs/specs/v1-tracer-bullet.md). Manual only, cost-gated: never triggered by
# pull_request or push. Runs apply -> [call] -> destroy for the s1 and s2
# scenario compositions inside the `live-test` GitHub Environment only,
# runs-on: ubuntu-latest, OIDC-only auth (no client secret, no stored Azure
# credential). Per CLAUDE.md's hard safety rules, this is the ONLY workflow in
# this repo that may run terraform apply/destroy.
#
# This workflow proves apply -> call -> destroy for both compositions. The
# "call" stage (issue 9 slice 2) runs McpTestClient session/tool assertions,
# the raw-HTTP discovery assertions (401/WWW-Authenticate/PRM/wrong-audience/
# shadow-key), and the bounded registry poll (scripts/gate/invoke-and-assert.ps1
# -> tests/integration/discovery-assertions.ps1 + src/McpTestClient). Split,
# documented honestly (docs/specs/v1-tracer-bullet.md, Testing Decisions): the
# gate validates non-interactive session and discovery artifacts; it does NOT
# auto-exercise client-driven interactive discovery, which is validated manually
# in VS Code and recorded in docs/demos/README.md.
#
# Auth pattern re-verified 2026-08-02 via Microsoft Learn and the upstream
# action metadata. Learn documents Azure Login OIDC with client-id, tenant-id,
# and subscription-id, but its samples still show azure/login@v2. The v3 action
# retains those inputs and moves its runtime to Node.js 24:
# https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect
# https://github.com/Azure/login/blob/v3/action.yml
# https://github.com/Azure/login/releases/tag/v3.0.0
# - The federated credential trusting this workflow must use an
#   Environment-scoped subject `repo:<org>/<repo>:environment:live-test`,
#   audience `api://AzureADTokenExchange`:
#   https://learn.microsoft.com/entra/workload-id/workload-identity-federation-create-trust
# - azure/login authenticates the Azure CLI only, not the azurerm/azapi
#   Terraform providers. Their own native OIDC support (ARM_USE_OIDC plus
#   ARM_CLIENT_ID/ARM_TENANT_ID/ARM_SUBSCRIPTION_ID) is documented on the
#   Terraform Registry, not Microsoft Learn (Microsoft Learn's own
#   "Authenticate Terraform to Azure" page does not mention OIDC as of
#   2026-07-12, confirmed stale by the verifier agent):
#   https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/guides/service_principal_oidc
#   Both mechanisms are configured below from the same OIDC identity.
#
# Actor guard (issue 120; actor allow-list widened 2026-08-18 to admit
# haripraghash-bot so autonomous goal/loop sessions can run this). The
# refs/heads/main dispatch guard that #140 added was REMOVED 2026-08-18 at
# Hari's instruction: this workflow can now be dispatched from ANY branch, and
# a branch dispatch runs that branch's own workflow file. The consequences are
# deliberate: the actor allow-list below is now the sole in-file control over
# who may trigger, the live-test Environment's own branch policy (which
# currently allows non-main branches) is the only remaining ref control, and a
# real apply-call-destroy run can therefore execute from unreviewed branch
# code. workflow_dispatch already requires write access to THIS repo and cannot
# be reached from a fork -- a GitHub platform guarantee, not something this
# file controls. The actor guard is an allow-list of exactly two: haripraghash
# and haripraghash-bot. The bot is allowed on purpose -- a goal or loop session
# dispatches this gated workflow to run live-run acceptance autonomously, and
# AGENTS.md's hard rule forbids apply/destroy only OUTSIDE the live-test gate,
# which this workflow is. Any other write-access actor fails the guard closed.
# By design the live-test Environment requires no reviewer approval, so a loop
# session runs unattended; the actor allow-list above is the sole control over
# who may trigger.

name: Ephemeral live-test gate

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Apply and destroy the ephemeral stamp, or verify the private AKS path."
        required: false
        type: choice
        default: apply-call-destroy
        options:
          - apply-call-destroy
          - verify-private
      confirm_cost:
        description: "For apply-call-destroy, type \"apply\" to confirm the billable deployment. verify-private is read-only."
        required: false
        type: string
      skip_teardown:
        description: "TEMPORARY debugging aid (issue 9): skip teardown so the deployed stamp stays up for INTERACTIVE investigation - e.g. the portal test console request trace of the no-token WWW-Authenticate/PRM mechanism (which policy or runtime step sets the path-scoped resource_metadata). WARNING: Basic v2 bills continuously until you delete the resource group by hand; the run summary prints the exact command. Destroy it the SAME day. Leave false for normal runs."
        required: false
        type: boolean
        default: false

# Only one live-test run at a time: prevents two runs racing on the same
# state keys or doubling billable resources.
concurrency:
  group: live-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Require authorized actor
        shell: bash
        run: |
          if [ "${{ github.actor }}" != "haripraghash" ] && [ "${{ github.actor }}" != "haripraghash-bot" ]; then
            echo "::error::This workflow may only be triggered by haripraghash or haripraghash-bot. Triggering actor was '${{ github.actor }}'."
            exit 1
          fi

      - name: Require explicit cost confirmation
        shell: bash
        run: |
          if [ "${{ inputs.action }}" = "apply-call-destroy" ] && [ "${{ inputs.confirm_cost }}" != "apply" ]; then
            echo "::error::confirm_cost must be the literal string 'apply'. This run deploys billable Azure resources; the input exists so nobody triggers it by accident."
            exit 1
          fi

  live-test:
    name: apply-call-destroy
    if: inputs.action == 'apply-call-destroy'
    needs: guard
    runs-on: ubuntu-latest
    environment: live-test
    env:
      # Shared OIDC identity for both the Azure CLI (azure/login) and the
      # Terraform azurerm/azapi providers/backends. No client secret; values
      # are non-secret app/tenant/subscription ids configured as GitHub
      # Environment variables on `live-test` (CLAUDE.md: never commit these
      # to the repo).
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      # State backend, key-per-composition (docs/specs/v1-tracer-bullet.md,
      # Terraform and state). The storage account is bootstrapped out of band
      # in its own resource group so this run's cleanup can never reach it.
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      S1_STATE_KEY: s1-entra-mcp-server.tfstate
      S2_STATE_KEY: s2-apim-mcp-gateway.tfstate
      SHARED_OBSERVABILITY_CORE_STATE_KEY: shared-observability-core.tfstate
      TF_VAR_shared_observability_core_remote_state: >-
        {"storage_account_name":"${{ vars.TF_STATE_STORAGE_ACCOUNT }}","container_name":"${{ vars.TF_STATE_CONTAINER }}","key":"shared-observability-core.tfstate"}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # MUST stay here, immediately after azure/login and BEFORE the long s1
      # apply. azure/login caches the GitHub OIDC token it used as the client
      # assertion, and that token lives only ~5 minutes; unlike the azurerm and
      # azapi providers (ARM_USE_OIDC), the Azure CLI does NOT mint a fresh one.
      # The s1 Flex Consumption apply routinely runs longer than 5 minutes, so an
      # `az` call placed after it fails with AADSTS700024 ("Client assertion is
      # not within its valid time range"). Running this lookup while the
      # assertion is fresh avoids that; its step output persists for the later s2
      # steps that consume it. Do not move it below the apply.
      - name: Look up the OIDC principal's object id (for the registry poll's Data Reader grant)
        id: principal
        shell: bash
        run: |
          object_id="$(az ad sp show --id "${{ vars.AZURE_CLIENT_ID }}" --query id -o tsv)"
          echo "object_id=${object_id}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # McpTestClient targets net10.0; the call stage runs it via `dotnet run`.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Issue 18: the live gate's audit-event check reads the ephemeral audit
      # Event Hub with the azure-eventhub SDK (no az CLI data-plane command
      # exists for this -- verified 2026-08-07). Pinned alongside the other
      # explicit toolchain setup steps in this workflow, not left to whatever
      # Python happens to be preinstalled on the runner image.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Event Hub gate dependencies
        run: pip install --quiet azure-eventhub azure-identity

      # Issue 9 (reopened) decision: the gate must run harness assertions against
      # a live host, which requires deployed function code. Build and package the
      # MCP server once here, up front, so the artifact is ready before the s1
      # apply and the deploy step below. Flex Consumption one-deploy takes a zip
      # whose root is the publish output (host.json at the zip root).
      - name: Build and package the Functions MCP server (McpTools)
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${{ github.workspace }}/publish/mcptools"
          dotnet publish src/McpTools/McpTools.csproj -c Release -o "${publish_dir}"
          ( cd "${publish_dir}" && zip -r "${{ github.workspace }}/mcptools.zip" . )

      # The synthetic downstream Orders API is called by both delegated OBO
      # and app-only trusted-subsystem paths. Same package pattern as above.
      - name: Build and package the downstream Orders API (DownstreamOrdersApi)
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${{ github.workspace }}/publish/downstreamordersapi"
          dotnet publish src/DownstreamOrdersApi/DownstreamOrdersApi.csproj -c Release -o "${publish_dir}"
          ( cd "${publish_dir}" && zip -r "${{ github.workspace }}/downstreamordersapi.zip" . )

      - name: Compute ephemeral resource group name and expiry tag
        id: rg
        shell: bash
        run: |
          rg_name="rg-mcp-tracer-${{ github.run_id }}"
          # 4-hour TTL: a policy choice for this gate's belt-and-braces expiry
          # tag, not a measured figure. The gate's own destroy step (below,
          # if: always()) is the primary cleanup mechanism; this tag is the
          # backstop if that step itself never runs (e.g. the runner is
          # killed outright).
          expiry="$(date -u -d '+4 hours' +%Y-%m-%dT%H:%M:%SZ)"
          echo "name=${rg_name}" >> "$GITHUB_OUTPUT"
          echo "expiry=${expiry}" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral resource group
        shell: bash
        run: |
          az group create \
            --name "${{ steps.rg.outputs.name }}" \
            --location "${{ vars.LIVE_TEST_LOCATION }}" \
            --tags expiry="${{ steps.rg.outputs.expiry }}" scenario=v1-tracer-bullet

      # Written from the live-test environment's S1_TFVARS_JSON/S2_TFVARS_JSON
      # secrets. Full key reference (kept in sync when a required variable is
      # added to either composition): docs/runbooks/live-test-tfvars-reference.md.
      # Secrets rather than variables because tenant/client ids are
      # org-identifying, even though they are not credentials.
      - name: Write composition tfvars
        shell: bash
        env:
          S1_TFVARS_JSON: ${{ secrets.S1_TFVARS_JSON }}
          S2_TFVARS_JSON: ${{ secrets.S2_TFVARS_JSON }}
        run: |
          printf '%s' "$S1_TFVARS_JSON" > "${{ github.workspace }}/s1.tfvars.json"
          printf '%s' "$S2_TFVARS_JSON" > "${{ github.workspace }}/s2.tfvars.json"

      - name: terraform init and apply - s1-entra-mcp-server
        working-directory: infra/terraform/scenarios/s1-entra-mcp-server
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
          TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${S1_STATE_KEY}"
          terraform apply -input=false -auto-approve \
            -var-file="${{ github.workspace }}/s1.tfvars.json"

      # Issue 9 (reopened) decision: deploy the built package to the s1 Flex
      # Consumption app so the host specialises and the MCP extension registers
      # its mcp_extension system key (which the call stage's shadow-key arm and
      # the McpTestClient assertions require). Flex Consumption's supported
      # deployment technology is "One deploy"; on a Flex app the config-zip CLI
      # verb TRIGGERS One deploy -- upload to the module's managed-identity
      # deploymentpackage container -- NOT the legacy Kudu WEBSITE_RUN_FROM_
      # PACKAGE path the same verb uses on other plans (Microsoft Learn:
      # flex-consumption-how-to#deploy-your-code-project). The decision comment
      # named `az functionapp deploy`, but that command is Preview and not the
      # Learn-documented Flex path; config-zip is (see PR description). The .NET
      # isolated output is prebuilt by the publish step above, so no remote
      # build. Runs after the s1 apply (the app must exist) and before the s2
      # apply (APIM in s2 fronts the now-live s1 backend).
      - name: Deploy the Functions MCP server to the s1 Flex Consumption app
        working-directory: infra/terraform/scenarios/s1-entra-mcp-server
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
        run: |
          set -euo pipefail
          func_name="$(terraform output -raw function_app_name)"
          # config-zip triggers Flex One deploy: Kudu fetches a managed-identity
          # token to reach the deploymentpackage container. The s1 module pins
          # deployment storage to a user-assigned identity (mcp-function-host):
          # the system-assigned identity was not reliably usable on this path and
          # failed persistently with "MSITokenUnavailableException ... 400". The
          # user-assigned identity's Storage role assignment is created in the
          # same apply moments earlier, so a bounded retry with fixed backoff
          # remains as insurance against RBAC propagation (general Azure RBAC
          # propagation is up to ~10 min, but a user-assigned grant typically
          # settles fast). Exhaustion stays FATAL; no storage-account-key path.
          deploy_deadline=$(( SECONDS + 300 ))
          attempt=1
          until az functionapp deployment source config-zip \
                  --resource-group "${TF_VAR_resource_group_name}" \
                  --name "${func_name}" \
                  --src "${{ github.workspace }}/mcptools.zip"; do
            if [ "${SECONDS}" -ge "${deploy_deadline}" ]; then
              echo "::error::config-zip deploy did not succeed within 300s; the Flex deployment-storage identity/RBAC never became usable (see the MSITokenUnavailableException in this step's log)."
              exit 1
            fi
            echo "Deploy attempt ${attempt} failed (likely deployment-storage identity/RBAC not yet propagated); retrying in 30s."
            attempt=$(( attempt + 1 ))
            sleep 30
          done

      # Issue 10 (OBO thickening): deploy the downstream Orders API to its
      # own Flex Consumption app (a second mcp-function-host instance in the
      # same s1 apply above). Identical config-zip / retry rationale as the
      # McpTools deploy step: this instance also pins deployment storage to
      # its own user-assigned identity.
      - name: Deploy the downstream Orders API to its Flex Consumption app
        working-directory: infra/terraform/scenarios/s1-entra-mcp-server
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
        run: |
          set -euo pipefail
          downstream_func_name="$(terraform output -raw downstream_function_app_name)"
          deploy_deadline=$(( SECONDS + 300 ))
          attempt=1
          until az functionapp deployment source config-zip \
                  --resource-group "${TF_VAR_resource_group_name}" \
                  --name "${downstream_func_name}" \
                  --src "${{ github.workspace }}/downstreamordersapi.zip"; do
            if [ "${SECONDS}" -ge "${deploy_deadline}" ]; then
              echo "::error::config-zip deploy did not succeed within 300s for the downstream Orders API (see the McpTools deploy step's MSITokenUnavailableException note; same mechanism applies here)."
              exit 1
            fi
            echo "Deploy attempt ${attempt} failed (likely deployment-storage identity/RBAC not yet propagated); retrying in 30s."
            attempt=$(( attempt + 1 ))
            sleep 30
          done

      - name: terraform init and apply - s2-apim-mcp-gateway
        working-directory: infra/terraform/scenarios/s2-apim-mcp-gateway
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
          TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
          TF_VAR_data_reader_principal_ids: ${{ format('["{0}"]', steps.principal.outputs.object_id) }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${S2_STATE_KEY}"
          terraform apply -input=false -auto-approve \
            -var-file="${{ github.workspace }}/s2.tfvars.json" \
            -var="s1_remote_state={\"storage_account_name\":\"${TF_STATE_STORAGE_ACCOUNT}\",\"container_name\":\"${TF_STATE_CONTAINER}\",\"key\":\"${S1_STATE_KEY}\"}"

      # Issue-9 instrumentation (temporary, non-fatal): capture the verbatim
      # WWW-Authenticate challenges and every candidate PRM location in one shot,
      # so a single live run settles which layer owns the RFC 9728 challenge and
      # which PRM URL shape resolves (two emitters exist: the APIM policy's
      # gateway-root challenge and the backend App Service Auth PRM feature). The
      # probes are anonymous (no token), so this sits before the call stage and is
      # decoupled from its token/key machinery. terraform output reads remote
      # state via the providers' own OIDC, so it does not need a fresh az login.
      # continue-on-error: a probe hiccup must never mask the real gate result.
      # Paired with the "Upload PRM discovery evidence" step (if: always()).
      # KEPT until the v1.1 interactive-auth work lands (ADR-006; issue #42):
      # a per-run detector of the PRM/challenge shape while that
      # surface is in flux. Remove this step, the upload step, and
      # scripts/gate/capture-prm-evidence.ps1 only when that work is done.
      - name: Capture PRM discovery evidence (anonymous probes)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          s1_dir=infra/terraform/scenarios/s1-entra-mcp-server
          s2_dir=infra/terraform/scenarios/s2-apim-mcp-gateway
          mcp_server_url="$(terraform -chdir="$s2_dir" output -raw mcp_server_url)"
          prm_url="$(terraform -chdir="$s2_dir" output -raw prm_url)"
          backend_base="$(terraform -chdir="$s1_dir" output -raw mcp_backend_base_url)"
          backend_mcp_url="${backend_base%/}/runtime/webhooks/mcp"
          pwsh scripts/gate/capture-prm-evidence.ps1 \
            -McpServerUrl "$mcp_server_url" \
            -PrmUrl "$prm_url" \
            -BackendMcpUrl "$backend_mcp_url" \
            -OutDir "${GITHUB_WORKSPACE}/gate-evidence"

      # Fresh OIDC login before the call stage. Same rationale as the teardown
      # and cleanup re-logins below: by this point the job has run past the
      # ~5-minute life of the initial azure/login client assertion (the s1/s2
      # applies alone exceed it, and APIM Basic v2 provisioning takes far
      # longer), and unlike the azurerm/azapi providers (ARM_USE_OIDC) the Azure
      # CLI does not mint a fresh OIDC token. The call stage makes two `az`
      # calls that would otherwise fail with AADSTS700024: the fatal API Center
      # data-plane token (az account get-access-token --resource
      # https://azure-apicenter.net, a new audience not cached at login) that the
      # registry poll needs, and the best-effort mcp_extension key lookup. This
      # step is NOT if: always() -- it belongs to the call path, which only runs
      # on a successful apply.
      - name: Azure re-login for call stage (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Option Y (deterministic registry, ADR-007): force the MCP server into the
      # API Center inventory synchronously, so the call stage can ASSERT its
      # convergence instead of waiting out APIM auto-sync (documented up to 24 h).
      # Verified live 2026-07-21: `az apic import-from-apim` is a blocking LRO
      # (~30-40 s) that is idempotent and coexists with the active apiSources
      # auto-sync link (no duplicate/conflict); the entry carries kind=mcp. This
      # is a CI-only determinism mechanism layered on the production auto-sync
      # path, which stays the headline. apic-extension stable (1.1.0) exposes the
      # command as `import-from-apim`; it is renamed to `import apim` only in the
      # 1.2.0b3 beta (COMPATIBILITY.md) -- a clean break there is the re-check
      # trigger, preferable to guessing the renamed command's unverified params.
      - name: Force registry convergence (import-from-apim, Option Y)
        shell: bash
        run: |
          set -euo pipefail
          s2_dir=infra/terraform/scenarios/s2-apim-mcp-gateway
          rg="${{ steps.rg.outputs.name }}"
          apic_name="$(terraform -chdir="$s2_dir" output -raw api_center_name)"
          apim_id="$(terraform -chdir="$s2_dir" output -raw apim_id)"
          apim_name="$(basename "$apim_id")"
          server_name="$(jq -r '.server_name' "${GITHUB_WORKSPACE}/s2.tfvars.json")"
          echo "Forcing convergence: import '${server_name}' from APIM '${apim_name}' into API Center '${apic_name}' (synchronous LRO)."
          az extension add --name apic-extension --only-show-errors
          # --apim-subscription is omitted: APIM and API Center share the ephemeral
          # subscription (the az context default), and that flag is not on Learn
          # (only in the extension --help), so the command stays on documented args.
          az apic import-from-apim -g "$rg" --service-name "$apic_name" \
            --apim-name "$apim_name" --apim-resource-group "$rg" \
            --apim-apis "[${server_name}]"
          echo "import-from-apim completed; the MCP server is now in the API Center inventory (call stage asserts it)."

      # Call stage: positive and role-less-negative McpTestClient assertions, the
      # raw-HTTP discovery assertions (401/WWW-Authenticate/PRM/wrong-audience/
      # shadow-key), and the bounded registry poll. Runs only on a successful
      # apply (no if: always()), between apply and the destroy steps below. The
      # gate does NOT auto-exercise interactive discovery; that is validated
      # manually in VS Code and recorded in docs/demos (spec: Testing Decisions).
      #
      # Identity/endpoint values are read from terraform outputs and the s2
      # tfvars (audience/tenant/test-client-id/server-name); the test client's
      # SECRET is a live-test Environment secret (TEST_CLIENT_SECRET), never in
      # the repo or in Terraform state (docs/runbooks/entra-app-registrations.md).
      - name: Call stage - authorization, discovery, registry poll
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
          TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
          TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}
          TEST_CLIENT_WITHOUT_ROLE_ID: ${{ secrets.TEST_CLIENT_WITHOUT_ROLE_ID }}
          TEST_CLIENT_WITHOUT_ROLE_SECRET: ${{ secrets.TEST_CLIENT_WITHOUT_ROLE_SECRET }}
          # Issue 17: cross-server isolation negative client (granted only server
          # 1's entitlement). Optional: if these secrets are unset the gate skips
          # the cross-server negative (docs/runbooks/entra-app-registrations.md).
          TEST_CLIENT_SERVER1_ONLY_ID: ${{ secrets.TEST_CLIENT_SERVER1_ONLY_ID }}
          TEST_CLIENT_SERVER1_ONLY_SECRET: ${{ secrets.TEST_CLIENT_SERVER1_ONLY_SECRET }}
          # Issue 80: cross-tool differentiation client (entitled to
          # get_service_info, not to get_order_status). Optional: if these
          # secrets are unset the gate skips checks (e)/(f)/(g)
          # (docs/runbooks/entra-app-registrations.md).
          TEST_CLIENT_MCP_SERVICE_TOOL_ID: ${{ secrets.TEST_CLIENT_MCP_SERVICE_TOOL_ID }}
          TEST_CLIENT_MCP_SERVICE_TOOL_SECRET: ${{ secrets.TEST_CLIENT_MCP_SERVICE_TOOL_SECRET }}
        run: |
          set -euo pipefail
          s1_dir=infra/terraform/scenarios/s1-entra-mcp-server
          s2_dir=infra/terraform/scenarios/s2-apim-mcp-gateway
          mcp_server_url="$(terraform -chdir="$s2_dir" output -raw mcp_server_url)"
          # Issue 17: server 2's endpoint for the per-server discovery + cross-server assertions.
          mcp_server_2_url="$(terraform -chdir="$s2_dir" output -raw mcp_server_2_url)"
          # Issue 18: per-tool authorization map keys for the set-equality gate assertion.
          tool_authorization_map_keys="$(terraform -chdir="$s2_dir" output -raw tool_authorization_map_keys)"
          server_2_tool_authorization_map_keys="$(terraform -chdir="$s2_dir" output -raw server_2_tool_authorization_map_keys)"
          # Shared Log Analytics workspace ARM id. The discovery script prints
          # it as a pointer to the durable observability trail; Event Hubs
          # remains the bounded pass/fail source for audit events.
          shared_observability_workspace_id="$(terraform -chdir="$s2_dir" output -raw shared_observability_workspace_id)"
          # Issue 18: ephemeral audit Event Hub, for the live gate's low-latency
          # audit-event check (parallel to the KQL assertion above, not a
          # replacement for the Application Insights audit trail itself).
          eventhub_namespace_fqdn="$(terraform -chdir="$s2_dir" output -raw eventhub_namespace_fqdn)"
          eventhub_name="$(terraform -chdir="$s2_dir" output -raw eventhub_name)"
          prm_url="$(terraform -chdir="$s2_dir" output -raw prm_url)"
          registry_url="$(terraform -chdir="$s2_dir" output -raw registry_endpoint_url)"
          api_center_id="$(terraform -chdir="$s2_dir" output -raw api_center_id)"
          backend_base="$(terraform -chdir="$s1_dir" output -raw mcp_backend_base_url)"
          backend_mcp_url="${backend_base%/}/runtime/webhooks/mcp"
          func_name="$(terraform -chdir="$s1_dir" output -raw function_app_name)"
          # Issue 10 (OBO thickening): the downstream Orders API's order-status
          # URL for the passthrough negative test.
          downstream_base="$(terraform -chdir="$s1_dir" output -raw downstream_base_url)"
          downstream_order_status_url="${downstream_base%/}/api/orders/CONTOSO-1001"
          # entra_validation identity values (non-secret ids) from the s2 tfvars.
          audience="$(jq -r '.entra_validation.audience' "${GITHUB_WORKSPACE}/s2.tfvars.json")"
          tenant_id="$(jq -r '.entra_validation.tenant_id' "${GITHUB_WORKSPACE}/s2.tfvars.json")"
          client_id="$(jq -r '.entra_validation.allowed_client_application_ids[0]' "${GITHUB_WORKSPACE}/s2.tfvars.json")"
          server_name="$(jq -r '.server_name' "${GITHUB_WORKSPACE}/s2.tfvars.json")"
          # The real mcp_extension system key is REQUIRED for the backend
          # shadow-key arm: presenting a VALID key that Easy Auth still 401s is
          # what proves the shadow path is closed (spec story 31); a placeholder
          # would only prove an invalid key is rejected. The key is registered by
          # the MCP extension at host specialisation, which happens AFTER the code
          # deploy completes (not at deploy return), so poll for it rather than
          # reading it once: 15s interval, 300s (5 min) budget. Each attempt is
          # guarded (2>/dev/null || true) so a transient listkeys non-zero does
          # not trip set -e mid-loop; exhausting the budget stays FATAL (issue 9
          # decision, preserving PR #39's fail-loudly intent -- no placeholder).
          mcp_ext_key=""
          key_poll_deadline=$(( SECONDS + 300 ))
          while [ "${SECONDS}" -lt "${key_poll_deadline}" ]; do
            mcp_ext_key="$(az functionapp keys list -g "${TF_VAR_resource_group_name}" -n "${func_name}" --query 'systemKeys.mcp_extension' -o tsv 2>/dev/null || true)"
            if [ -n "${mcp_ext_key}" ]; then
              break
            fi
            echo "mcp_extension system key not registered yet (awaiting host specialisation); retrying in 15s."
            sleep 15
          done
          if [ -z "${mcp_ext_key}" ]; then
            echo "::error::Could not retrieve the mcp_extension system key; the backend shadow-key assertion needs it (spec story 31)."
            exit 1
          fi
          # --- Call-stage diagnostics (read-only, non-fatal): localise the MCP
          # 500 between the APIM passthrough and the Functions backend before the
          # assertions run. Probes the backend /runtime/webhooks/mcp directly with
          # a valid Entra token vs the same call through APIM, and dumps the
          # effective APIM MCP api config (backendId/serviceUrl/mcpProperties).
          # Temporary, remove once the call stage is green (issue 9). ---
          api_id="$(terraform -chdir="$s2_dir" output -raw mcp_server_api_id)"
          set +e
          diag_token="$(curl -sS --max-time 20 -X POST "https://login.microsoftonline.com/${tenant_id}/oauth2/v2.0/token" \
            -d "client_id=${client_id}" -d "client_secret=${TEST_CLIENT_SECRET}" \
            -d "grant_type=client_credentials" -d "scope=${audience}/.default" | jq -r '.access_token // empty')"
          if [ -n "${diag_token}" ]; then
            curl -sS --max-time 15 -o /dev/null -w "[diag] backend direct (${backend_mcp_url}) status: %{http_code}\n" \
              -H "Authorization: Bearer ${diag_token}" "${backend_mcp_url}"
            curl -sS --max-time 15 -o /dev/null -w "[diag] via APIM (${mcp_server_url}) status: %{http_code}\n" \
              -H "Authorization: Bearer ${diag_token}" "${mcp_server_url}"
          else
            echo "[diag] could not acquire a diagnostic token; skipping HTTP probes."
          fi
          echo "[diag] effective APIM MCP api config:"
          az rest --method GET --url "https://management.azure.com${api_id}?api-version=2025-09-01-preview" \
            --query "properties.{type:type,path:path,backendId:backendId,serviceUrl:serviceUrl,mcpProperties:mcpProperties}" -o json 2>/dev/null \
            || echo "[diag]   (az rest dump failed)"
          set -e
          # --- end diagnostics ---
          pwsh scripts/gate/invoke-and-assert.ps1 \
            -McpServerUrl "$mcp_server_url" \
            -PrmUrl "$prm_url" \
            -RegistryEndpointUrl "$registry_url" \
            -BackendMcpUrl "$backend_mcp_url" \
            -Audience "$audience" \
            -TenantId "$tenant_id" \
            -ClientId "$client_id" \
            -ClientSecret "$TEST_CLIENT_SECRET" \
            -ClientWithoutRoleId "$TEST_CLIENT_WITHOUT_ROLE_ID" \
            -ClientWithoutRoleSecret "$TEST_CLIENT_WITHOUT_ROLE_SECRET" \
            -ServerName "$server_name" \
            -DownstreamOrderStatusUrl "$downstream_order_status_url" \
            -McpExtensionKey "${mcp_ext_key:-}" \
            -ApiCenterResourceId "$api_center_id" \
            -McpServer2Url "$mcp_server_2_url" \
            -Server1OnlyClientId "${TEST_CLIENT_SERVER1_ONLY_ID:-}" \
            -Server1OnlyClientSecret "${TEST_CLIENT_SERVER1_ONLY_SECRET:-}" \
            -ServiceToolClientId "${TEST_CLIENT_MCP_SERVICE_TOOL_ID:-}" \
            -ServiceToolClientSecret "${TEST_CLIENT_MCP_SERVICE_TOOL_SECRET:-}" \
            -ToolAuthorizationMapKeys "$tool_authorization_map_keys" \
            -Server2ToolAuthorizationMapKeys "$server_2_tool_authorization_map_keys" \
            -SharedObservabilityWorkspaceId "$shared_observability_workspace_id" \
            -EventHubNamespaceFqdn "$eventhub_namespace_fqdn" \
            -EventHubName "$eventhub_name" \
            -EvidenceDir "${GITHUB_WORKSPACE}/gate-evidence"

      # Always upload whatever PRM evidence was captured above, even when the
      # call stage failed its assertions (the failing assertion is the whole
      # reason we want the evidence). Reads the runner's local filesystem, so it
      # is unaffected by the destroy steps that follow. Temporary issue-9
      # instrumentation; KEPT until the v1.1 interactive-auth work (remove with
      # the capture step and script then).
      - name: Upload PRM discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prm-discovery-evidence
          path: gate-evidence/
          if-no-files-found: warn

      - name: terraform destroy - s2-apim-mcp-gateway
        if: always() && !inputs.skip_teardown
        working-directory: infra/terraform/scenarios/s2-apim-mcp-gateway
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
          TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
          TF_VAR_data_reader_principal_ids: ${{ format('["{0}"]', steps.principal.outputs.object_id) }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file="${{ github.workspace }}/s2.tfvars.json" \
            -var="s1_remote_state={\"storage_account_name\":\"${TF_STATE_STORAGE_ACCOUNT}\",\"container_name\":\"${TF_STATE_CONTAINER}\",\"key\":\"${S1_STATE_KEY}\"}"

      - name: terraform destroy - s1-entra-mcp-server
        if: always() && !inputs.skip_teardown
        working-directory: infra/terraform/scenarios/s1-entra-mcp-server
        shell: bash
        env:
          TF_VAR_resource_group_name: ${{ steps.rg.outputs.name }}
          TF_VAR_location: ${{ vars.LIVE_TEST_LOCATION }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file="${{ github.workspace }}/s1.tfvars.json"

      # Refresh the Azure CLI credential before the final CLI-based cleanup. By
      # this point the job has run well past the ~5-minute life of the OIDC
      # client assertion from the initial azure/login (the s1/s2 applies and
      # destroys together take far longer), so a stale `az` call would fail with
      # AADSTS700024 and LEAK the ephemeral resource group. Unlike the azurerm
      # and azapi providers, the Azure CLI does not mint a fresh OIDC token, so
      # re-login explicitly. if: always() so cleanup authenticates even when an
      # earlier step failed.
      - name: Azure re-login for cleanup (OIDC)
        if: always() && !inputs.skip_teardown
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete ephemeral resource group and verify it is gone
        if: always() && !inputs.skip_teardown
        shell: bash
        run: |
          az group delete --name "${{ steps.rg.outputs.name }}" --yes
          if az group show --name "${{ steps.rg.outputs.name }}" >/dev/null 2>&1; then
            echo "::error::Resource group ${{ steps.rg.outputs.name }} still exists after delete. The expiry tag (${{ steps.rg.outputs.expiry }}) is the belt-and-braces backstop; verify the sweep process picks it up."
            exit 1
          fi
          echo "Confirmed: ${{ steps.rg.outputs.name }} no longer exists."

      # Loud, unmissable notice when skip_teardown kept the stamp alive. The last
      # several issue-9 debug rounds were strangled by the environment evaporating
      # between runs; keeping it up is deliberate here (interactive portal/curl
      # trace of the no-token WWW-Authenticate mechanism), but a kept-alive Basic
      # v2 stamp bills continuously, so the RG name and the exact teardown command
      # go into the run summary AND a ::warning:: annotation. Runs whether the gate
      # passed or failed. YOU destroy it the same day; the 4-hour expiry tag is
      # only a backstop sweep, not a guarantee.
      - name: Kept-alive environment notice (skip_teardown)
        if: always() && inputs.skip_teardown
        shell: bash
        run: |
          rg="${{ steps.rg.outputs.name }}"
          expiry="${{ steps.rg.outputs.expiry }}"
          echo "::warning title=Live environment kept ALIVE::${rg} was NOT destroyed (skip_teardown=true) and bills continuously. Destroy it today: az group delete -n ${rg} --yes"
          {
            echo "## :warning: Live environment kept ALIVE (skip_teardown=true)"
            echo ""
            echo "Teardown was **skipped on purpose** so you can trace the no-token"
            echo "\`WWW-Authenticate\`/PRM mechanism interactively against the running stamp."
            echo "**A Basic v2 stamp bills continuously.**"
            echo ""
            echo "- Resource group: \`${rg}\`"
            echo "- Backstop expiry tag: \`${expiry}\` (a sweep, not a guarantee)"
            echo ""
            echo "### Destroy it yourself, the SAME day"
            echo ""
            echo '```bash'
            echo "az group delete -n ${rg} --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-private-control-plane:
    name: verify-private-control-plane
    if: inputs.action == 'verify-private'
    needs: guard
    runs-on: ubuntu-latest
    environment: live-test
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_PLATFORM_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_PLATFORM_CLUSTER_NAME }}
      SHARED_OBSERVABILITY_RESOURCE_GROUP: ${{ vars.SHARED_OBSERVABILITY_RESOURCE_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check private MCP control-plane prerequisites
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${AKS_RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER_NAME}" \
            --overwrite-existing
          az aks install-cli --only-show-errors || true
          kubelogin convert-kubeconfig -l azurecli

          for application in mcp-platform-mcp mcp-platform-placeholder; do
            application_json="$(kubectl get application "${application}" -n argocd -o json)"
            sync_status="$(jq -r '.status.sync.status // "Unknown"' <<< "${application_json}")"
            health_status="$(jq -r '.status.health.status // "Unknown"' <<< "${application_json}")"
            health_message="$(jq -r '.status.health.message // "none reported"' <<< "${application_json}")"
            echo "Argo CD application ${application}: sync=${sync_status}; health=${health_status}; message=${health_message}"
            if [ "${sync_status}" != "Synced" ] || [ "${health_status}" != "Healthy" ]; then
              if [ "${application}" = "mcp-platform-mcp" ]; then
                mcp_deployment_json="$(kubectl get deployment mcp-server -n mcp-platform -o json)"
                desired_replicas="$(jq -r '.spec.replicas // 0' <<< "${mcp_deployment_json}")"
                updated_replicas="$(jq -r '.status.updatedReplicas // 0' <<< "${mcp_deployment_json}")"
                available_replicas="$(jq -r '.status.availableReplicas // 0' <<< "${mcp_deployment_json}")"
                echo "MCP deployment mcp-server: desired=${desired_replicas}; updated=${updated_replicas}; available=${available_replicas}"
                mcp_pod_selector="$(jq -er '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")' <<< "${mcp_deployment_json}")"
                mcp_pod_states="$(kubectl get pods -n mcp-platform -l "${mcp_pod_selector}" -o json \
                  | jq -r '
                    [.items[]
                     | "\(.metadata.name): owner=\([.metadata.ownerReferences[]?.name // empty] | join(",")); phase=\(.status.phase // "Unknown"); ready=\([.status.containerStatuses[]? | select(.ready)] | length)/\([.status.containerStatuses[]?] | length); waiting=\([.status.containerStatuses[]?.state.waiting.reason // empty] | join(",")); conditions=\([.status.conditions[]? | "\(.type)=\(.status):\(.reason // ""): \(.message // "")"] | join(","))"]
                    | if length == 0 then "none reported" else join("; ") end
                  ')"
                echo "MCP pod states: ${mcp_pod_states}"
              fi
              echo "::error title=Argo CD application not ready::${application}: sync=${sync_status}; health=${health_status}; message=${health_message}"
              exit 1
            fi
          done

          kubectl rollout status deployment/mcp-server -n mcp-platform --timeout=120s
          kubectl rollout status deployment/mcp-platform-placeholder \
            -n mcp-platform-demo --timeout=120s
          certificate_json="$(kubectl get certificate mcp-platform-mcp-tls \
            -n aks-istio-ingress -o json)"
          certificate_ready="$(jq -r \
            'any(.status.conditions[]?; .type == "Ready" and .status == "True")' \
            <<< "${certificate_json}")"
          if [ "${certificate_ready}" != "true" ]; then
            echo "::error title=Private MCP certificate not ready::mcp-platform-mcp-tls is not Ready."
            exit 1
          fi
          echo "Private MCP certificate mcp-platform-mcp-tls: Ready=${certificate_ready}"
          pod_selector="$(kubectl get deployment mcp-server -n mcp-platform -o json \
            | jq -er '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')"
          pod="$(kubectl get pods -n mcp-platform -l "${pod_selector}" -o json \
            | jq -er '[.items[] | select(.status.phase == "Running") | select(all(.status.containerStatuses[]?; .ready))][0].metadata.name')"
          pod_json="$(kubectl get pod "${pod}" -n mcp-platform -o json)"
          sidecar_present="$(jq -r \
            '[.spec.containers[].name] | index("istio-proxy") != null' \
            <<< "${pod_json}")"
          if [ "${sidecar_present}" != "true" ]; then
            echo "::error title=Istio sidecar missing::MCP pod ${pod} has no istio-proxy container."
            exit 1
          fi
          echo "MCP pod ${pod}: istio-proxy present"
          redirect_init_present="$(jq -r \
            'any(.spec.initContainers[]?; .name == "istio-init" and ([.args[]?] | join(" ") | contains("REDIRECT")))' \
            <<< "${pod_json}")"
          if [ "${redirect_init_present}" != "true" ]; then
            echo "::error title=Istio REDIRECT init mode missing::MCP pod ${pod} is not configured for REDIRECT interception."
            exit 1
          fi
          echo "MCP pod ${pod}: Istio init interception=REDIRECT"
          iptables_rules="$(kubectl exec "${pod}" -n mcp-platform -c istio-proxy -- iptables -t nat -S)"
          if ! grep --fixed-strings --quiet REDIRECT <<< "${iptables_rules}"; then
            echo "::error title=Istio REDIRECT rule missing::MCP pod ${pod} has no REDIRECT rule in the NAT table."
            exit 1
          fi
          echo "MCP pod ${pod}: NAT REDIRECT rule observed"

          component_id="$(az resource list \
            --resource-group "${SHARED_OBSERVABILITY_RESOURCE_GROUP}" \
            --resource-type Microsoft.Insights/components \
            --query '[0].id' \
            --output tsv)"
          if [ -z "${component_id}" ]; then
            echo "::error::No Application Insights component was found in the shared observability resource group."
            exit 1
          fi
          disable_local_auth="$(az resource show \
            --ids "${component_id}" \
            --api-version 2020-02-02 \
            --query properties.DisableLocalAuth \
            --output tsv)"
          if [ "${disable_local_auth,,}" != true ]; then
            echo "::error::Application Insights local authentication is not disabled."
            exit 1
          fi

  # PRIVATE_MCP_VNET_RUNNER_GROUP and PRIVATE_MCP_VNET_RUNNER_LABEL must be
  # repository or organization variables. They are intentionally not defined
  # on the live-test Environment, even though this job reads its test secrets.
  verify-private-data-plane:
    name: verify-private-data-plane
    if: inputs.action == 'verify-private'
    needs: verify-private-control-plane
    runs-on:
      group: ${{ vars.PRIVATE_MCP_VNET_RUNNER_GROUP }}
      labels: ${{ vars.PRIVATE_MCP_VNET_RUNNER_LABEL }}
    environment: live-test
    env:
      MCP_PRIVATE_HOST: mcp.internal.consultwithcloud.com
      MCP_PRIVATE_IP: ${{ vars.AKS_PLATFORM_INGRESS_PRIVATE_IP }}
      S2_TFVARS_JSON: ${{ secrets.S2_TFVARS_JSON }}
      TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}
      TEST_CLIENT_WITHOUT_ROLE_ID: ${{ secrets.TEST_CLIENT_WITHOUT_ROLE_ID }}
      TEST_CLIENT_WITHOUT_ROLE_SECRET: ${{ secrets.TEST_CLIENT_WITHOUT_ROLE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify private MCP data plane
        shell: bash
        run: |
          set -euo pipefail
          test_client_id="$(jq -er '.entra_validation.allowed_client_application_ids[0]' <<< "${S2_TFVARS_JSON}")"
          resource_audience="$(jq -er '.entra_validation.audience' <<< "${S2_TFVARS_JSON}")"
          tenant_id="$(jq -er '.entra_validation.tenant_id' <<< "${S2_TFVARS_JSON}")"
          MCP_RESOURCE_AUDIENCE="${resource_audience}" \
          AZURE_TENANT_ID="${tenant_id}" \
          TEST_CLIENT_ID="${test_client_id}" \
          bash scripts/gate/verify-private-mcp.sh
