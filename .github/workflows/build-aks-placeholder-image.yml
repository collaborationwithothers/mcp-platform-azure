# Placeholder image pipeline for the epic 108 child (b) AKS platform (issue
# 110 task 9). Manual only, workflow_dispatch, never triggered by
# pull_request or push: this is a deliberate action for a placeholder proof,
# not part of the fast PR CI loop. runs-on: ubuntu-latest, OIDC-only Azure
# auth (no client secret, no stored Azure credential) -- same auth pattern as
# deploy-aks-platform.yml and ephemeral-env.yml.
#
# This workflow builds nothing (issue 110's out-of-scope list: no application
# code, src/McpTools and src/DownstreamOrdersApi stay untouched). It re-pushes
# a small, already-published public image into this repo's own registry,
# retagged with the git commit SHA (issue 110 section 2, "Images are... tagged
# by git commit"), so Argo CD can pull a known artifact from a registry this
# platform controls rather than from an external one. No Dockerfile, no build
# step.
#
# docker pull/tag/push, not `az acr import`: `az acr import` does a
# server-side copy and needs no local docker daemon, which reads as the more
# Azure-native choice at first glance. It is rejected here because the CI
# identity's only grant on the target registry is the AcrPush role (see
# infra/terraform/scenarios/s1-aks-platform/main.tf, acr_push_principal_ids,
# and container-registry/outputs.tf's login_server output comment, which
# already names this workflow's intended pattern as "az acr login / docker
# push"), and this session could not re-check against Microsoft Learn whether
# AcrPush alone covers the importImage data-plane action `az acr import`
# needs, or whether it needs a broader role such as Contributor. docker push
# only needs the push/pull data actions AcrPush already grants, the
# well-established mechanism this repo documents elsewhere
# (container-registry-authentication). Revisit `az acr import` once that
# permission question is verified.
#
# Environment gate: this job declares `environment: live-test`, the same
# GitHub Environment deploy-aks-platform.yml and ephemeral-env.yml use. A
# registry push is not a Terraform apply/destroy and is not itself a billable
# infrastructure change, so cost gating alone would not require it. It is
# declared anyway for a harder reason: the only OIDC federated credential
# this repo has configured trusts the Environment-scoped subject
# `repo:<org>/<repo>:environment:live-test` (ephemeral-env.yml's own header
# comment), and deploy-aks-platform.yml's idle-stop/idle-start jobs -- plain
# `az aks stop`/`az aks start` calls, not Terraform applies either -- already
# reuse live-test for that same reason, not because they are cost-gated
# actions in their own right. Provisioning a second, differently-scoped
# federated credential is a Hari-only step and out of scope here, so this
# workflow follows that precedent instead of inventing a new environment or
# attempting an OIDC login whose subject would not match the existing trust.
#
# Base image: Docker Hub's nginx image, pinned by the `source_image` input's
# default below rather than `:latest`. Its manifest was verified on
# 2026-08-17. The workflow checks the selected manifest before Azure login, so
# a removed tag or invalid override fails before it can reach the registry
# push step.
#
# After the image push, the workflow reads the placeholder workload identity
# client ID from the AKS platform's Terraform state. It then uses a GitHub App
# installation token, scoped to the companion manifests repository, to send a
# repository_dispatch event. The companion repository creates the reviewable
# GitOps promotion PR with its own GITHUB_TOKEN. This removes manual copying of
# either value without giving this workflow direct Git write access to the
# companion repository.
#
# Actor guard (issue 120; actor allow-list widened 2026-08-18 to admit
# haripraghash-bot so autonomous goal/loop sessions can run this). The
# refs/heads/main dispatch guard that #140 added was REMOVED 2026-08-18 at
# Hari's instruction: this workflow can now be dispatched from ANY branch, and
# a branch dispatch runs that branch's own workflow file. The consequences are
# deliberate: the actor allow-list below is now the sole in-file control over
# who may trigger, and the live-test Environment's own branch policy (which
# currently allows non-main branches) is the only remaining ref control.
# workflow_dispatch already requires write access to THIS repo and cannot be
# reached from a fork -- a GitHub platform guarantee, not something this file
# controls. The actor guard is an allow-list of exactly two: haripraghash and
# haripraghash-bot. The bot is allowed on purpose -- a goal or loop session
# dispatches this gated workflow autonomously to reach the live-test
# Environment's promotion credentials, and AGENTS.md's hard rule forbids
# apply/destroy only OUTSIDE the live-test gate, which this workflow is. Any
# other write-access actor fails the guard closed. By design the live-test
# Environment requires no reviewer approval, so a loop session runs unattended;
# the actor allow-list above is the sole control over who may reach those
# credentials. This workflow has no separate guard job, so the actor check is
# the first step of push-placeholder-image, before checkout.

name: Build AKS placeholder image

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Public image to re-push, as registry/repository:tag. Must not be :latest. Defaults to a verified nginx tag; override only with another immutable tag."
        required: false
        type: string
        default: "docker.io/library/nginx:1.27.4-alpine"

permissions:
  contents: read
  id-token: write

jobs:
  push-placeholder-image:
    name: push-placeholder-image
    runs-on: ubuntu-latest
    environment: live-test
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      AKS_PLATFORM_STATE_KEY: s1-aks-platform.tfstate
      TARGET_IMAGE: ${{ vars.AKS_PLATFORM_REGISTRY_NAME }}.azurecr.io/mcp-platform-placeholder:${{ github.sha }}
    steps:
      - name: Require authorized actor
        shell: bash
        run: |
          if [ "${{ github.actor }}" != "haripraghash" ] && [ "${{ github.actor }}" != "haripraghash-bot" ]; then
            echo "::error::This workflow may only be triggered by haripraghash or haripraghash-bot. Triggering actor was '${{ github.actor }}'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate source image
        shell: bash
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
        run: |
          set -euo pipefail
          image_tail="${SOURCE_IMAGE##*/}"
          if [[ "${image_tail}" != *:* ]] || [[ "${image_tail}" == *:latest ]]; then
            echo "::error::source_image must name a non-latest image tag."
            exit 1
          fi
          if ! docker manifest inspect "${SOURCE_IMAGE}" >/dev/null; then
            echo "::error::Source image ${SOURCE_IMAGE} has no accessible manifest."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Read the placeholder workload identity
        id: workload-identity
        working-directory: infra/terraform/scenarios/s1-aks-platform
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${AKS_PLATFORM_STATE_KEY}"
          workload_identity_client_id="$(terraform output -raw placeholder_workload_client_id)"
          if ! [[ "${workload_identity_client_id}" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::The AKS platform state did not return a valid placeholder workload identity client ID. Run Deploy AKS platform with bootstrap first."
            exit 1
          fi
          echo "client_id=${workload_identity_client_id}" >> "$GITHUB_OUTPUT"

      - name: az acr login
        shell: bash
        run: az acr login --name "${{ vars.AKS_PLATFORM_REGISTRY_NAME }}"

      - name: Pull, retag by commit SHA, and push
        shell: bash
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
        run: |
          set -euo pipefail
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"
          echo "Pushed ${TARGET_IMAGE}"

      - name: Require GitHub App promotion credentials
        shell: bash
        env:
          GITOPS_PROMOTION_APP_CLIENT_ID: ${{ vars.GITOPS_PROMOTION_APP_CLIENT_ID }}
          GITOPS_PROMOTION_APP_PRIVATE_KEY: ${{ secrets.GITOPS_PROMOTION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for required in GITOPS_PROMOTION_APP_CLIENT_ID GITOPS_PROMOTION_APP_PRIVATE_KEY; do
            if [ -z "${!required}" ]; then
              echo "::error::${required} is required on the live-test Environment. Complete the GitHub App setup in docs/runbooks/aks-platform-bootstrap.md."
              exit 1
            fi
          done

      - name: Create companion promotion token
        id: promotion-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GITOPS_PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTION_APP_PRIVATE_KEY }}
          owner: collaborationwithothers
          repositories: mcp-platform-kubernetes-manifests
          permission-contents: write

      - name: Request GitOps promotion
        shell: bash
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
          WORKLOAD_IDENTITY_CLIENT_ID: ${{ steps.workload-identity.outputs.client_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg image_reference "${TARGET_IMAGE}" \
            --arg workload_identity_client_id "${WORKLOAD_IDENTITY_CLIENT_ID}" \
            --arg source_commit "${GITHUB_SHA}" \
            '{event_type: "aks-placeholder-image-promoted", client_payload: {image_reference: $image_reference, workload_identity_client_id: $workload_identity_client_id, source_commit: $source_commit}}' \
            | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY_OWNER}/mcp-platform-kubernetes-manifests/dispatches" \
              --input -

      - name: Report image and promotion request
        shell: bash
        run: |
          {
            echo "## Placeholder image promotion requested"
            echo ""
            echo "Image reference: \`${TARGET_IMAGE}\`"
            echo ""
            echo "The manifests repository received the promotion request and will open"
            echo "a draft PR if these values are not already on main. Review that PR;"
            echo "do not edit the Argo CD Application YAML by hand."
          } >> "$GITHUB_STEP_SUMMARY"
