# Continuous integration for the MCP-on-Azure platform.
#
# The two jobs below (terraform-checks, dotnet-build) are wired up as required
# status checks in branch protection, so their names must stay stable and both
# jobs must ALWAYS run. That is why there are no path filters at the trigger
# level: a required check that is skipped by a path filter reports as "pending"
# forever and blocks every PR. Instead, each individual step guards itself with
# a find/test and prints SKIPPED when there is nothing to check yet (the repo is
# a Phase 0 skeleton: infra/ and src/ exist but hold no .tf or .csproj files).
#
# Tool versions are verified against primary sources on 2026-07-11:
# - Terraform 1.15.8: https://checkpoint-api.hashicorp.com/v1/check/terraform
# - .NET 10 (LTS) for Azure Functions 4.x isolated worker:
#   https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide#supported-versions

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No token is needed for the
# checks below, and no write scopes are granted.
permissions:
  contents: read

# Cancel superseded runs on the same ref so only the newest commit is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    name: terraform-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Terraform files under infra/
        id: detect
        shell: bash
        run: |
          if [ -d infra ] && [ -n "$(find infra -type f -name '*.tf' -print -quit)" ]; then
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
            echo "Found .tf files under infra/."
          else
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "No .tf files under infra/ yet."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          # Disable the output wrapper so plain terraform runs cleanly in loops.
          terraform_wrapper: false

      - name: terraform fmt
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.has_tf }}" != "true" ]; then
            echo "SKIPPED: no .tf files under infra/."
            exit 0
          fi
          terraform fmt -check -recursive infra/

      - name: terraform init and validate
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.has_tf }}" != "true" ]; then
            echo "SKIPPED: no .tf files under infra/."
            exit 0
          fi
          # Validate every directory that directly contains .tf files.
          dirs="$(find infra -type f -name '*.tf' -exec dirname {} \; | sort -u)"
          for d in $dirs; do
            echo "== ${d} =="
            terraform -chdir="${d}" init -backend=false -input=false
            terraform -chdir="${d}" validate
          done

      - name: terraform test
        shell: bash
        run: |
          # Discover every directory holding a .tftest.hcl file, independent
          # of has_tf above: a fixture module can hold ONLY tests/outputs and
          # no resources (issue 83's policy_rendering.tftest.hcl is the first
          # one), so its own presence is the right gate, not a generic .tf
          # scan. Each such directory is a self-contained root module (its
          # own init), so this never needs the real modules' providers or
          # Azure credentials -- see the header comment on each fixture's
          # main.tf for why. Excludes .terraform/: the PRIOR step in this same
          # job already ran `terraform init` for every real module, which
          # downloads AVM modules locally into .terraform/modules/ -- some of
          # which vendor their OWN .tftest.hcl test suites (observed:
          # mcp-function-host's avm_interfaces dependency). Those need real
          # provider credentials this job does not have and are not ours to
          # run; only .tftest.hcl files actually committed to this repo count.
          dirs="$(find infra -type f -name '*.tftest.hcl' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)"
          if [ -z "$dirs" ]; then
            echo "SKIPPED: no .tftest.hcl files under infra/."
            exit 0
          fi
          for d in $dirs; do
            echo "== ${d} =="
            terraform -chdir="${d}" init -backend=false -input=false
            terraform -chdir="${d}" test
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: tflint
        shell: bash
        env:
          # Resolve the committed config regardless of --chdir.
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
        run: |
          if [ "${{ steps.detect.outputs.has_tf }}" != "true" ]; then
            echo "SKIPPED: no .tf files under infra/."
            exit 0
          fi
          # tflint --init downloads the azurerm plugin anonymously from GitHub.
          # If shared-runner rate limits ever cause this to fail, set a
          # GITHUB_TOKEN env on this step from the built-in github.token (read
          # only, no new secret needed). Left off for now to keep CI secret-free.
          tflint --init
          tflint --chdir=infra --recursive

      - name: checkov
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.has_tf }}" != "true" ]; then
            echo "SKIPPED: no .tf files under infra/."
            exit 0
          fi
          # pipx is preinstalled on ubuntu-latest runners.
          pipx install checkov
          checkov --directory infra --quiet --compact

  dotnet-build:
    name: dotnet-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect .NET projects under src/
        id: detect
        shell: bash
        run: |
          if [ -d src ] && [ -n "$(find src -type f \( -name '*.sln' -o -name '*.csproj' \) -print -quit)" ]; then
            echo "has_dotnet=true" >> "$GITHUB_OUTPUT"
            echo "Found .sln/.csproj under src/."
          else
            echo "has_dotnet=false" >> "$GITHUB_OUTPUT"
            echo "No .sln/.csproj under src/ yet."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: dotnet build and test
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.has_dotnet }}" != "true" ]; then
            echo "SKIPPED: no .sln or .csproj under src/."
            exit 0
          fi
          # Prefer a solution when one exists; it defines the build/test set.
          sln="$(find src -type f -name '*.sln' -print -quit)"
          if [ -n "$sln" ]; then
            echo "Building and testing solution: ${sln}"
            dotnet build "$sln" --configuration Release
            dotnet test "$sln" --configuration Release --no-build
            exit 0
          fi
          # No solution: build every project, then test projects under */tests/*.
          echo "No .sln found; building each project under src/."
          while IFS= read -r -d '' proj; do
            echo "== build ${proj} =="
            dotnet build "$proj" --configuration Release
          done < <(find src -type f -name '*.csproj' -print0)
          test_found=false
          while IFS= read -r -d '' proj; do
            test_found=true
            echo "== test ${proj} =="
            dotnet test "$proj" --configuration Release --no-build
          done < <(find src -path '*/tests/*' -type f -name '*.csproj' -print0)
          if [ "$test_found" = "false" ]; then
            echo "No test projects found under src/**/tests; nothing to test."
          fi

  # NOT a required status check (the two required checks are terraform-checks and
  # dotnet-build; their names must stay stable). This job enforces the MCP config
  # parity rule between .mcp.json and .codex/config.toml (AGENTS.md > MCP servers
  # and config parity). Hari may promote it to a required check in branch
  # protection if desired. Dependency-free: uses the runner's Python 3 stdlib
  # (tomllib needs >= 3.11; ubuntu-latest ships >= 3.12).
  mcp-parity:
    name: mcp-parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: check-mcp-parity
        shell: bash
        run: python3 scripts/check-mcp-parity

  # NOT a required status check. Runs the unit tests for the COMPATIBILITY.md
  # drift agent harness (issue #4): scripts/drift/extract_triggers.py and
  # apply_verdicts.py. Dependency-free like mcp-parity: stdlib unittest on the
  # runner's Python 3, no pip install. Self-guards with find and prints SKIPPED
  # until the tests land, so the job is safe to add before the scripts exist.
  # Hari may promote it to a required check in branch protection if desired.
  drift-agent-tests:
    name: drift-agent-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run drift-agent unit tests
        shell: bash
        run: |
          if [ -d scripts/drift/tests ] && [ -n "$(find scripts/drift/tests -type f -name 'test_*.py' -print -quit)" ]; then
            python3 -m unittest discover -s scripts/drift/tests -v
          else
            echo "SKIPPED: no scripts/drift/tests yet."
          fi

  # NOT a required status check. Unit tests for the compat-sync guard harness
  # (issue #64): scripts/compat_sync/check_compat_sync.py, the required
  # `compat-sync` check's decision logic. Dependency-free like drift-agent-tests:
  # stdlib unittest on the runner's Python 3, no pip install. Self-guards with
  # find and prints SKIPPED until the tests land. The GUARD itself is the
  # separate required check in .github/workflows/compat-sync.yml; this job only
  # locks down its logic. Hari may promote it to a required check if desired.
  compat-sync-tests:
    name: compat-sync-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run compat-sync unit tests
        shell: bash
        run: |
          if [ -d scripts/compat_sync/tests ] && [ -n "$(find scripts/compat_sync/tests -type f -name 'test_*.py' -print -quit)" ]; then
            python3 -m unittest discover -s scripts/compat_sync/tests -v
          else
            echo "SKIPPED: no scripts/compat_sync/tests yet."
          fi
