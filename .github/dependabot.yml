# Dependabot version updates (issue #64): registry-drift hygiene for the pinned
# packages in COMPATIBILITY.md "Pinned versions".
#
# SCOPE. This owns REGISTRY drift only: a newer version of a pinned NuGet
# package, Terraform provider, or registry module (including public-registry AVM
# modules) has been published. SEMANTIC DOC drift (the documented behaviour of a
# fixed pin changing under it, e.g. an ARM api-version string embedded in an
# azapi body, a feature moving preview->GA) is issue #4's compat-drift agent,
# NOT Dependabot. The two are complementary and must not overlap. See
# COMPATIBILITY.md "Registry drift vs documentation drift" and AGENTS.md.
#
# GOVERNANCE. Dependabot PRs are NEVER auto-merge-ok. They edit files under
# /src, /infra, or /.github, so the existing merge-class rules (AGENTS.md
# GOVERNANCE > Merge classes) already forbid an agent merging them; they go
# through governance review on Opus 4.8 like any other pin change. A raw bump PR
# also edits only the manifest and leaves the COMPATIBILITY.md row stale, so the
# required `compat-sync` status check (.github/workflows/compat-sync.yml) FAILS
# any `dependencies`-labelled PR that does not also update COMPATIBILITY.md. The
# reviewer brings the matching pin row along (fresh doc link + Last-verified
# date) in the same PR before it can go green.
#
# HONEST LIMITS (do not overclaim; mirrored in COMPATIBILITY.md). Dependabot
# does NOT see, and does NOT update:
#   - ARM api-version strings inside azapi resource bodies (e.g.
#     2025-09-01-preview). Not a provider/module version. Issue #4 / manual.
#   - Transitive pins we do not directly PackageReference (e.g.
#     ModelContextProtocol 0.4.0-preview.3 pulled via the Mcp.Sdk preview
#     package). Dependabot bumps the direct parent only.
#   - The Terraform CLI `required_version` / .terraform-version pin. The
#     terraform ecosystem updates provider and module versions, not the CLI
#     version (dependabot/dependabot-core#8725).
# Prerelease NuGet pins (the `-preview` rows): Dependabot proposes a prerelease
# update only for a dependency already on a prerelease, so the stable pins are
# not dragged onto preview. Confirm this holds on the first real bump PR before
# relying on it; behaviour has known edge cases for NuGet semver prereleases.
# Exact pins (e.g. avm-res-web-site = 0.22.0) exist for a reason recorded in
# their COMPATIBILITY.md row; grouped weekly PRs are reviewed, not rubber-stamped.

version: 2

updates:
  # NuGet: every project that carries a direct PackageReference pin. The issue
  # enumerated McpTools and McpTestClient; DownstreamOrdersApi (issue #10) landed
  # afterwards and carries the same Worker/Worker.Sdk pins plus Extensions.Http,
  # so it is included here for the same pin-hygiene reason.
  - package-ecosystem: nuget
    directories:
      - "/src/McpTools"
      - "/src/McpTestClient"
      - "/src/DownstreamOrdersApi"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      nuget:
        patterns:
          - "*"

  # Terraform: provider version constraints (required_providers) and
  # registry-module `version` args, including public-registry AVM modules, in
  # every module and scenario. `directories` globbing (the `*`) is a
  # `directories`-only feature. Does not touch required_version (CLI pin).
  - package-ecosystem: terraform
    directories:
      - "/infra/terraform/modules/*"
      - "/infra/terraform/scenarios/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      terraform:
        patterns:
          - "*"
    # AzureRM 5 is held off because avm-res-apimanagement-service 0.9.0
    # declares hashicorp/azurerm >= 4.0, < 5.0. That is the ONLY pinned AVM
    # module with an azurerm constraint. avm-res-web-site is azapi-based and
    # has none, at any version; do not cite it here (an earlier COMPATIBILITY
    # row did, and was wrong).
    #
    # Lift this ignore only when BOTH conditions hold, as one change:
    #   1. avm-res-apimanagement-service publishes a release whose azurerm
    #      constraint accepts 5.x.
    #   2. This repo's own azurerm resources are validated against the AzureRM
    #      5.0 upgrade guide. The two modules declare nine azurerm resources
    #      across eight types (service_plan, storage_account,
    #      storage_container, user_assigned_identity, role_assignment,
    #      eventhub_namespace, eventhub, monitor_diagnostic_setting), none of
    #      them from an AVM module, so condition 1 says nothing about them.
    # Condition 1 announces itself: AVM module bumps are not ignored, so a
    # Dependabot bump PR for avm-res-apimanagement-service is the signal.
    # Condition 2 does not, and is the larger job. Treat that bump PR as
    # permission to start, not permission to finish. Tracked as issue 96.
    #
    # Use a `versions` range here, never `update-types:
    # version-update:semver-major`. An update-type condition needs a concrete
    # current version to work out what "major" means, and for a `~> 4.80`
    # constraint Dependabot finds one only by reading .terraform.lock.hcl. The
    # scenarios have a lock file; the two wrapper modules do not, and should
    # not (a lock file belongs to a root configuration, not to a consumed
    # module). There the current version is nil, the condition yields no
    # ignored ranges, and the rule does nothing at all -- which is how PRs 72
    # and 91 were opened. A `versions` range applies with or without a lock
    # file.
    #
    # One side effect of that choice: a `versions` ignore also suppresses
    # SECURITY updates inside its range, which an update-types ignore does
    # not. Intended here, since no AzureRM 5 should land by any route until
    # the constraint above clears. See the 2026-08-09 change log entry in
    # COMPATIBILITY.md.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        versions:
          - ">= 5.0.0"

  # GitHub Actions: pinned action versions in .github/workflows. Directory "/"
  # is the documented value; Dependabot scans .github/workflows from there.
  # Action pins are tracked in the COMPATIBILITY.md "Pinned versions" table.
  # Each bump must update its row with a fresh official link and verification
  # date in the same PR; compat-sync enforces that file-level lockstep.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
